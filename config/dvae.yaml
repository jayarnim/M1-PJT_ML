# RUNTIME ==========
seed: 42


# MODEL ==========
model:
  name: dvae
  params:
    input_dim: 28
    latent_dim: 256
    output_dim: 28
    hidden_dim: [64, 128]
    dropout: 0.2


# DATAMODULE PACKAGE ==========
split:
  ratio:
    trn: 0.8
    val: 0.2
  shuffle: True

dataloader:
  batch_size: 128
  shuffle: True


# TRAINER PACKAGE ==========
num_epochs: 100

early_stopping:
  patience: 5
  delta: 0.0001
  warmup: 10

criterion:
  name: mse
  params:

annealing:
  name: linear
  params:
    min: 0.0
    max: 0.1
    warmup: 10

optimizer:
  name: adamw
  params:
    lr: 0.001
    weight_decay: 0.00001
